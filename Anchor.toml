[toolchain]
# Pinned at Gate 0. Never upgrade (CLAUDE.md). Solana = version Anchor 0.32.3's CI tests against.
anchor_version = "0.32.3"
solana_version = "4.1.2"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

# Program keypair: target/deploy/metrex-keypair.json (gitignored). Back it up to
# ~/.config/metrex/metrex-program.json; losing it means a new program ID.
[programs.devnet]
metrex = "AHSbJKM2kihhjNcaEhpwvDpX9DADQ2E36KX8tfCigu8X"
# v2 (spec-v2 D1). Not deployed until local gates V1–V3 pass. Keypair backed up at
# ~/.config/metrex/metrex-exchange-program.json.
metrex_exchange = "BrHisWF8aXQzrCvvDPMsPXJyMXwVrWQTB479jtvB6Fko"

[programs.localnet]
metrex = "AHSbJKM2kihhjNcaEhpwvDpX9DADQ2E36KX8tfCigu8X"
metrex_exchange = "BrHisWF8aXQzrCvvDPMsPXJyMXwVrWQTB479jtvB6Fko"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Quoted so mocha (not the shell) expands it; tests/helpers/ holds shared helpers, not specs.
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 'tests/*.ts'"

[test]
startup_wait = 30000
shutdown_wait = 2000
# initialize_config checks the program's upgrade authority (spec §6),
# so the local validator must deploy the program as upgradeable.
upgradeable = true

# A local-only stale Listing used by the holder validation test.
[[test.validator.account]]
address = "2jekJs2FoB4UWVXmgbN1Eqwgj9Z5pce5KN3X72Yb64V5"
filename = "tests/fixtures/deferred-listing.json"
